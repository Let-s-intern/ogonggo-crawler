# main 에 들어온 것을 GHCR 이미지로 만든다. Coolify 가 이 이미지를 받아 띄운다.
name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      # compose 의 이미지 태그를 이 워크플로우가 고쳐서 되돌려 놓는다. 그래서 write 다
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          # 아래에서 커밋해 되돌려 놓으므로 토큰이 남아 있어야 한다
          persist-credentials: true

      # Chromium 이 들어가 이미지가 2.3GB 가 넘는다. 빌드 캐시가 없으면 매번 브라우저를
      # 다시 받는다 (.claude/tasks/todo/result-job-crawler-push11.md 의 실측).
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # 떠 있는 코드가 무엇인지 이미지가 스스로 알게 한다. compose 가 태그를 고정하지
          # 않으므로 `/health` 의 이 값이 배포된 커밋을 아는 유일한 길이다
          build-args: |
            BUILD_SHA=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 이미지 태그를 이번 커밋으로 고정해 되돌려 놓는다. **이것이 배포가 실제로 갈리는 이유다.**
      #
      # `:latest` 로 두면 Coolify 가 받아 온 적 있는 이미지를 다시 쓴다. 2026-08-28 에 이미지도
      # 웹훅도 정상인데 서버만 사흘 전 코드로 떠 있었고, 강제 pull 을 켜도 같았다. 태그가 매번
      # 달라지면 받아 온 적 없는 이름이라 그럴 수가 없다.
      #
      # Coolify 가 이 파일을 읽으므로 **웹훅보다 먼저** 커밋한다. 순서가 바뀌면 Coolify 가 옛
      # 파일을 읽고 옛 이미지를 띄운다.
      #
      # 커밋 메시지의 `[skip ci]` 가 없으면 이 푸시가 워크플로우를 다시 부르고 끝나지 않는다.
      - name: compose 의 이미지 태그를 고정한다
        if: github.ref == 'refs/heads/main' && success()
        env:
          FILE: docker-compose.coolify.yml
        run: |
          tag="sha-$(echo "${{ github.sha }}" | cut -c1-7)"
          # 이미지 이름은 소문자만 쓸 수 있다. `github.repository` 에 대문자가 있으면 GHCR 에
          # 올라간 이름과 여기서 찾는 이름이 어긋나 아래 sed 가 아무 줄도 못 찾는다
          name=$(echo "${{ env.IMAGE }}" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/$name:$tag"
          # 찾을 줄이 없으면 실패로 끝낸다. 2026-09-15 에 레포 이름이 바뀐 뒤 이 단계가 옛
          # 이름의 줄을 못 찾고도 "이미 고정돼 있다" 며 지나갔고, 그 사이 배포는 8/31 이미지를
          # 계속 다시 띄웠다. 못 고쳤으면 배포도 가지 않아야 한다
          if ! grep -qE "^[[:space:]]*image: ghcr\.io/$name:" "$FILE"; then
            echo "::error::$FILE 에 ghcr.io/$name 이미지 줄이 없다. 태그를 고정하지 못했다"
            exit 1
          fi
          # `\s` 는 BSD sed 에 없다. 로컬에서 같은 줄을 시험할 수 있게 POSIX 문자류를 쓴다
          sed -i -E "s|^([[:space:]]*image: ghcr\.io/$name):.*$|\1:$tag|" "$FILE"
          if git diff --quiet -- "$FILE"; then
            echo "이미 $image 다. 커밋하지 않는다"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          git commit -m "chore(infra): Coolify 이미지를 $tag 로 올린다 [skip ci]"
          # 이 실행 중에 main 이 움직였으면 그 위에 얹는다. 실패하면 배포 웹훅도 안 나가고,
          # 그때는 이미지만 올라간 채로 남아 손으로 다시 걸면 된다
          git pull --rebase origin main
          git push origin HEAD:main
          echo "$image 로 고정했다"

      # compose 를 고쳐 놓은 뒤에 Coolify 에 받아 가라고 알린다. 앞 단계가 태그를 바꿔 뒀으므로
      # Coolify 는 받아 온 적 없는 이름을 보게 되고, 그래서 실제로 새 이미지를 받는다.
      #
      # `force=true` 는 남겨 둔다. 같은 커밋에 배포를 다시 걸 때 "바뀐 것 없음" 으로 건너뛰지
      # 않게 하는 안전장치다.
      #
      # 실패해도 이미지는 이미 올라가 있고 compose 도 고쳐져 있다. 배포만 손으로 다시 걸면 된다.
      - name: Coolify 재배포 요청
        if: github.ref == 'refs/heads/main' && success()
        env:
          URL: ${{ secrets.COOLIFY_DEPLOY_URL }}
          TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$URL" ] || [ -z "$TOKEN" ]; then
            echo "COOLIFY_DEPLOY_URL 이나 COOLIFY_TOKEN 이 없다. 배포 요청을 건너뛴다"
            exit 0
          fi
          code=$(curl -sS -o /tmp/coolify.out -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" "$URL")
          echo "Coolify 응답 $code"
          # 본문에 토큰이 실릴 일은 없지만, 실패했을 때만 앞부분을 남긴다
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            head -c 300 /tmp/coolify.out
            echo
            exit 1
          fi
