# main 에 들어온 것을 GHCR 이미지로 만들고 EC2 에 띄운다.
#
# 2026-09-17 Coolify(임시)에서 EC2 로 옮겼다. 렛츠커리어 dev 서버와 같은 방식이다 — 러너가 SSH 키로
# 서버에 들어가 이미지를 받고 다시 띄운다. 서버에는 main 만 띄운다 — main 에 푸시하면 배포된다.
#
# 레포 시크릿
#   EC2_HOST     탄력적 IP
#   EC2_USER     Ubuntu AMI 면 ubuntu, Amazon Linux 면 ec2-user
#   EC2_KEY      인스턴스 키 페어의 개인 키(.pem 내용 전체)
#   CRAWLER_ENV  서버의 .env 내용 전체. ADMIN_PASSWORD 등 (docker-compose.ec2.yml)
name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}

    steps:
      - uses: actions/checkout@v4

      # 배포 잡이 받을 이미지 이름. 이름은 소문자만 쓸 수 있다
      - id: name
        run: |
          name=$(echo "${{ env.IMAGE }}" | tr '[:upper:]' '[:lower:]')
          echo "image=${{ env.REGISTRY }}/$name:sha-$(echo "${{ github.sha }}" | cut -c1-7)" >> "$GITHUB_OUTPUT"

      # Chromium 이 들어가 이미지가 2.3GB 가 넘는다. 빌드 캐시가 없으면 매번 브라우저를
      # 다시 받는다 (.claude/tasks/todo/result-job-crawler-push11.md 의 실측).
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # 떠 있는 코드가 무엇인지 이미지가 스스로 알게 한다. 배포 잡이 `/health` 의 이 값으로
          # 새 코드가 떴는지 확인한다
          build-args: |
            BUILD_SHA=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    # 서버에는 언제나 main 만 띄운다. 다른 브랜치를 수동 실행하면 이미지만 만들고 배포하지 않는다
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # 배포가 겹치면 뒤의 것이 앞의 것을 기다린다. 동시에 compose up 하면 컨테이너가 꼬인다
    concurrency:
      group: deploy-ec2
      cancel-in-progress: false
    permissions:
      contents: read
      # 서버가 GHCR 비공개 패키지를 받을 때 이 잡의 토큰으로 로그인한다. 잡이 끝나면 토큰도 끝난다
      packages: read

    steps:
      - uses: actions/checkout@v4

      - name: 서버 디렉터리를 만든다
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: mkdir -p ~/ogonggo-crawler

      - name: compose 파일을 복사한다
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: docker-compose.ec2.yml
          target: ~/ogonggo-crawler

      - name: 이미지를 받아 다시 띄우고 새 코드가 떴는지 확인한다
        uses: appleboy/ssh-action@v1.2.0
        env:
          CRAWLER_IMAGE: ${{ needs.image.outputs.image }}
          CRAWLER_ENV: ${{ secrets.CRAWLER_ENV }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          envs: CRAWLER_IMAGE,CRAWLER_ENV,GHCR_USER,GHCR_TOKEN,BUILD_SHA
          command_timeout: 20m
          script: |
            set -eu
            cd ~/ogonggo-crawler
            if [ -z "$CRAWLER_ENV" ]; then
              echo "CRAWLER_ENV 시크릿이 비었다. ADMIN_PASSWORD 없이 띄우지 않는다"
              exit 1
            fi
            umask 077
            printf '%s\n' "$CRAWLER_ENV" > .env
            echo "$GHCR_TOKEN" | sudo docker login ghcr.io -u "$GHCR_USER" --password-stdin
            sudo CRAWLER_IMAGE="$CRAWLER_IMAGE" docker compose -f docker-compose.ec2.yml pull
            sudo CRAWLER_IMAGE="$CRAWLER_IMAGE" docker compose -f docker-compose.ec2.yml up -d --remove-orphans
            sudo docker logout ghcr.io
            # 기동 때 마이그레이션이 돈다. 새 코드가 `/health` 에 뜰 때까지 기다린다
            for i in $(seq 1 30); do
              build=$(curl -fsS --max-time 5 http://127.0.0.1/health 2>/dev/null | sed -n 's/.*"build":"\([^"]*\)".*/\1/p' || true)
              if [ "$build" = "$BUILD_SHA" ]; then
                echo "배포 완료: $CRAWLER_IMAGE"
                sudo docker image prune -f
                exit 0
              fi
              sleep 5
            done
            echo "2분 반을 기다려도 새 코드가 뜨지 않았다. 지금 떠 있는 build=$build"
            sudo CRAWLER_IMAGE="$CRAWLER_IMAGE" docker compose -f docker-compose.ec2.yml logs --tail 80 api
            exit 1
