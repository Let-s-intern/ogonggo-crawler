{# 수집 항목 미리 보기 결과. 저장하지 않았다 #}
{% if error %}
<p class="notice notice-bad">{{ error }}</p>
{% elif rows %}
<div class="rounded-md border border-slate-200">
  <p class="border-b border-slate-100 px-3 py-2 text-xs font-semibold text-slate-500">미리 보기 · 저장하지 않았습니다</p>
  <ul class="divide-y divide-slate-100 text-sm">
    {% for title, value in rows %}
    <li class="px-3 py-2">
      <span class="block truncate text-xs text-slate-500">{{ title }}</span>
      {% if value %}<span class="block">{{ value }}</span>{% else %}<span class="block text-amber-600">찾지 못함</span>{% endif %}
    </li>
    {% endfor %}
  </ul>
</div>
{% else %}
<p class="notice notice-idle">본문이 있는 공고가 아직 없어 미리 볼 수 없습니다</p>
{% endif %}
