{% extends "base.html" %}
{% from "macros.html" import empty %}
{% block title %}대시보드{% endblock %}
{% block heading %}대시보드{% endblock %}
{% block content %}
<div id="dashboard-summary" hx-get="/ui/dashboard" hx-trigger="load" hx-swap="innerHTML">
  {{ empty("불러오는 중") }}
</div>

<div class="card mt-4">
  <div class="card-head">
    <p class="card-title">최근 로그</p>
    <p class="text-xs text-slate-400">이 프로세스가 방금 낸 줄. 재시작하면 빈다</p>
  </div>
  <div id="dashboard-logs" class="px-4 py-3"
       hx-get="/ui/dashboard/logs" hx-trigger="load, every 3s" hx-swap="innerHTML">
    {{ empty("불러오는 중") }}
  </div>
</div>
{% endblock %}
