{% extends "pages/settings.html" %}
{% from "macros.html" import empty %}
{% block section %}
<section>
  <h3>파일 저장소</h3>
  <p class="text-sm text-slate-600">
    회사 로고를 올려 두는 S3 호환 저장소다. 바꿔도 이미 올린 파일은 따라가지 않고, 다음 업로드부터 새
    저장소로 간다.
  </p>
  <div id="storage-form" hx-get="/ui/storage" hx-trigger="load" hx-swap="innerHTML">
    {{ empty("저장소 설정을 불러오는 중") }}
  </div>
</section>
{% endblock %}
